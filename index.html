<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeonBlip – Free Neon Games</title>
  <meta name="description" content="Free neon browser games. Tap and play – no download, no sign-up.">
  <meta property="og:title" content="NeonBlip – Free Neon Games">
  <meta property="og:description" content="Free neon browser games. Tap and play – no download.">
  <meta name="theme-color" content="#06010f">
  <style>
    :root { --bg: #06010f; --text: #f2eaff; --muted: #a99bc4; --pink: #ff2bd6; --cyan: #22e6ff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      padding: 48px 16px 32px; }
    h1 { margin: 0; font-size: clamp(2.6rem, 11vw, 4.5rem); letter-spacing: .02em;
      color: #fff; text-shadow: 0 0 8px var(--pink), 0 0 24px var(--pink), 0 0 48px var(--pink); }
    .sub { margin: 10px 0 36px; color: var(--muted); font-size: 1.05rem; text-align: center; }
    .games { width: 100%; max-width: 440px; display: grid; gap: 16px; }
    a.game { display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 20px 22px; border-radius: 18px; text-decoration: none; color: var(--text);
      border: 2px solid var(--c); background: rgba(255,255,255,.03);
      box-shadow: 0 0 14px color-mix(in srgb, var(--c) 45%, transparent), inset 0 0 14px color-mix(in srgb, var(--c) 18%, transparent);
      transition: transform .12s ease; }
    a.game:active { transform: scale(.97); }
    a.game:hover { transform: translateY(-2px); }
    .name { font-size: 1.35rem; font-weight: 700; }
    .desc { color: var(--muted); font-size: .92rem; margin-top: 4px; }
    .play { flex: none; font-weight: 800; color: var(--bg); background: var(--c);
      padding: 10px 16px; border-radius: 999px; }
    footer { margin-top: auto; padding-top: 48px; color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <h1>NeonBlip</h1>
  <p class="sub">Free neon games – tap and play, no download.</p>

  <main class="games">
    <a class="game" href="/ring/" style="--c: var(--pink)">
      <div><div class="name">Neon Ring</div><div class="desc">Spin the ring, keep the ball inside.</div></div>
      <span class="play">PLAY</span>
    </a>
    <a class="game" href="/color-rush-game/" style="--c: var(--cyan)">
      <div><div class="name">Color Rush</div><div class="desc">Match the colors – as fast as you can.</div></div>
      <span class="play">PLAY</span>
    </a>
  </main>

  <footer>neonblip.com</footer>
</body>
</html>
